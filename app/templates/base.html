<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}eBay Deal Monitor{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-3 group">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-900/40 group-hover:scale-105 transition">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-lg tracking-tight text-white group-hover:text-emerald-400 transition">eBay Deal Monitor</span>
                            <span class="text-xs text-slate-400 font-medium">Unraid Server Edition</span>
                        </div>
                    </a>
                </div>

                <!-- Navigation Links -->
                <nav class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-3.5 py-2 rounded-lg text-sm font-medium transition {% if request.url.path == '/' %}bg-slate-800 text-emerald-400 border border-slate-700{% else %}text-slate-300 hover:bg-slate-800/60 hover:text-white{% endif %}">
                        Dashboard
                    </a>
                    <a href="/rules" class="px-3.5 py-2 rounded-lg text-sm font-medium transition {% if request.url.path.startswith('/rules') %}bg-slate-800 text-emerald-400 border border-slate-700{% else %}text-slate-300 hover:bg-slate-800/60 hover:text-white{% endif %}">
                        Search Monitors
                    </a>
                    <a href="/settings" class="px-3.5 py-2 rounded-lg text-sm font-medium transition {% if request.url.path.startswith('/settings') %}bg-slate-800 text-emerald-400 border border-slate-700{% else %}text-slate-300 hover:bg-slate-800/60 hover:text-white{% endif %}">
                        Settings & Logs
                    </a>
                </nav>

                <!-- Status Pill & Actions -->
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-slate-300">Scanner Active</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-900/50 py-6 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">
            <div>eBay Deal Monitor &bull; Optimized for Unraid Docker</div>
            <div class="flex items-center space-x-4">
                <a href="https://github.com" target="_blank" class="hover:text-slate-400 transition">Documentation</a>
                <span>&bull;</span>
                <span id="system-time">{{ now }}</span>
            </div>
        </div>
    </footer>

    <!-- Global Modal Container -->
    <div id="modal-container"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
